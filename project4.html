<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Contact the Pet Adoption demo project."><title>Pet Adoption | Contact</title><link rel="stylesheet" href="style.css"></head>

<main id="main-content" class="container"><div class="card"><h1>Contact Us</h1><p>Have a question about adoption? Send us a message.</p><p><strong>Email:</strong> <a href="mailto:petadoption@example.com">petadoption@example.com</a></p><p><strong>Phone:</strong> +91 00000 00000</p></div><div class="card"><h2>Send Message</h2><form id="contactForm" class="form"><label for="contactName">Your name</label><input id="contactName" type="text" autocomplete="name" required><label for="contactEmail">Your email</label><input id="contactEmail" type="email" autocomplete="email" required><label for="contactMessage">Your message</label><textarea id="contactMessage" required></textarea><button class="btn" type="submit">Send Message</button></form><div id="message" class="message" role="status" aria-live="polite"></div></div></main>
<script>document.getElementById('contactForm').addEventListener('submit',function(e){e.preventDefault();const m=document.getElementById('message');m.style.display='block';m.textContent='Thank you! Your message has been received in this demo.';this.reset()});</script>
</body></html>
