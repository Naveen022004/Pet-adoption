<main class="container"><div class="card"><h1>Contact Us</h1><p>Have a question about adoption? Send us a message.</p><p><strong>Email:</strong> petadoption@example.com</p><p><strong>Phone:</strong> +91 00000 00000</p></div><div class="card"><h2>Send Message</h2><form id="contactForm" class="form"><input type="text" placeholder="Your name" required><input type="email" placeholder="Your email" required><textarea placeholder="Your message" required></textarea><button class="btn" type="submit">Send Message</button></form><div id="message" class="message"></div></div></main>
<script>document.getElementById('contactForm').addEventListener('submit',function(e){e.preventDefault();const m=document.getElementById('message');m.style.display='block';m.textContent='Thank you! Your message has been received in this demo.';this.reset()});</script>
