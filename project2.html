<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Choose Pet</title><link rel="stylesheet" href="style.css"></head>
<body>
<nav><a href="index.html">Home</a><a href="project1.html">Adoption</a><a class="active" href="project2.html">Choose Pet</a><a href="project3.html">Donation</a><a href="project4.html">Contact</a><a href="project5.html">Consultation</a></nav>
<main class="container"><h1>Choose Your Pet</h1><p>Select one animal and breed, then confirm your choice.</p><form id="petForm"><div class="grid">
<article class="pet-card"><img src="dogg.jpeg" alt="Dog"><h3>Dog</h3><label>Breed<select id="dogs"><option value="">Select breed</option><option>Golden Retriever</option><option>Pug</option><option>German Shepherd</option><option>Bulldog</option></select></label></article>
<article class="pet-card"><img src="cat1.jpeg" alt="Cat"><h3>Cat</h3><label>Breed<select id="cats"><option value="">Select breed</option><option>Maine Coon</option><option>Ragdoll</option><option>Siamese</option><option>Persian</option></select></label></article>
<article class="pet-card"><img src="rabbit1.jpeg" alt="Rabbit"><h3>Rabbit</h3><label>Breed<select id="rabbits"><option value="">Select breed</option><option>Mini Rex</option><option>Holland Lop</option><option>Dutch</option><option>Lionhead</option></select></label></article>
<article class="pet-card"><img src="birds.jpeg" alt="Bird"><h3>Bird</h3><label>Breed<select id="birds"><option value="">Select breed</option><option>Canary</option><option>Conure</option><option>Parrotlet</option><option>Pionus</option></select></label></article>
</div><div class="card"><label><input type="checkbox" id="sure" required> I confirm that I want to continue with this adoption selection.</label><br><br><button class="btn" type="submit">Confirm Selection</button><div id="message" class="message"></div></div></form></main>
<script>document.getElementById('petForm').addEventListener('submit',function(e){e.preventDefault();const picks=[['Dog',document.getElementById('dogs').value],['Cat',document.getElementById('cats').value],['Rabbit',document.getElementById('rabbits').value],['Bird',document.getElementById('birds').value]].filter(x=>x[1]);if(picks.length!==1){alert('Please select exactly one pet and breed.');return}localStorage.setItem('selectedPet',picks[0][0]+' - '+picks[0][1]);const m=document.getElementById('message');m.style.display='block';m.textContent='Selected: '+picks[0][0]+' - '+picks[0][1]+'. Your adoption request is ready.'});</script>
</body></html>
